# Managed by hstack-kit. A thin wrapper: every check is defined in .hstack-kit/checks/*.json and run by
# scripts/kit/checks.mjs, which any CI system can call the same way. Add or change checks there, not here.
name: hstack-kit-react-counter

on:
  pull_request:
    paths: ["examples/react-counter/**",".github/workflows/hstack-kit-react-counter.yml","package.json","package-lock.json","npm-shrinkwrap.json","pnpm-lock.yaml","yarn.lock","bun.lock","bun.lockb","turbo.json","tsconfig*"]
  push:
    branches: [main]
    paths: ["examples/react-counter/**",".github/workflows/hstack-kit-react-counter.yml","package.json","package-lock.json","npm-shrinkwrap.json","pnpm-lock.yaml","yarn.lock","bun.lock","bun.lockb","turbo.json","tsconfig*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: examples/react-counter

jobs:
  plan:
    name: plan (react-counter)
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - id: list
        run: echo "checks=$(node scripts/kit/checks.mjs list --json --event ${{ github.event_name }})" >> "$GITHUB_OUTPUT"

  check:
    name: check (react-counter ${{ matrix.check }})
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: setup
        run: node scripts/kit/checks.mjs setup
      - name: ${{ matrix.check }}
        run: node scripts/kit/checks.mjs run ${{ matrix.check }}
      - name: Evidence summary
        if: always()
        run: cat .verify/evidence/*/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: evidence-react-counter-${{ matrix.check }}
          path: examples/react-counter/.verify/evidence/
          if-no-files-found: ignore
          retention-days: 14
